server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 location = /api/insights {proxy_pass http://insights-service:8082;proxy_set_header Host $host;}
 location /api/ {proxy_pass http://claims-service:8081;proxy_set_header Host $host;}
 location = /health/claims {proxy_pass http://claims-service:8081/actuator/health/readiness;}
 location = /health/insights {proxy_pass http://insights-service:8082/actuator/health/readiness;}
 location = /health/web {access_log off;default_type text/plain;return 200 'ok';}
 location /mfe/ {try_files $uri =404;add_header Cache-Control "no-cache";}
 location ~ \.json$ {try_files $uri =404;add_header Cache-Control "no-cache";}
 location / {try_files $uri $uri/ /index.html;}
}
