apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: claimspace
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: claimspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: localhost/claimspace/web:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: CLAIMS_UPSTREAM
          value: claims-service.claimspace.svc.cluster.local:8081
        - name: INSIGHTS_UPSTREAM
          value: insights-service.claimspace.svc.cluster.local:8082
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health/claims
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/web
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 15
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 192Mi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
