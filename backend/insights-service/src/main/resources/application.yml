server:
  port: ${PORT:8082}
spring:
  application:
    name: insights-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims_platform?currentSchema=insights}
    username: ${DB_USER:insights_app}
    password: ${DB_PASSWORD:local-insights-only}
    hikari:
      maximum-pool-size: 8
  flyway:
    default-schema: insights
    schemas: insights
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: insights-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
demo:
  password: ${DEMO_PASSWORD:ClaimsDemo!2026}
