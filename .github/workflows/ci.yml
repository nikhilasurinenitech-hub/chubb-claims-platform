name: Verify Claimspace
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: backend/**/pom.xml
    - name: Unit and PostgreSQL integration tests
      run: mvn -B -ntp -f backend/pom.xml verify
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-reports
        path: 'backend/**/target/*-reports/

          backend/**/target/site/jacoco/'
  frontend-and-system:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install, test and build Angular
      run: 'npm --prefix frontend ci

        npm --prefix frontend test

        npm --prefix frontend run build'
    - name: Start containers
      run: docker compose up --build -d --wait --wait-timeout 240
    - name: API and Kafka smoke test
      run: python3 scripts/smoke.py
    - name: Browser scenarios
      run: 'cd frontend

        npx playwright install --with-deps chromium

        npm run e2e'
    - name: Capture logs
      if: always()
      run: docker compose logs --no-color > container-logs.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: browser-and-container-reports
        path: 'frontend/playwright-report/

          frontend/test-results/

          container-logs.txt'
    - name: Stop containers
      if: always()
      run: docker compose down
