openapi: 3.0.3
info:
  title: Claimspace Claims Platform API
  version: 1.0.0
  description: Local assessment API. HTTP Basic demo identity requires explicit Authorization
    headers. Use TLS and replace demo identity before production.
servers:
- url: http://localhost:8080
security:
- basicAuth: []
paths:
  /api/session:
    get:
      summary: Read the authenticated demo identity
      operationId: get__api_session
      tags:
      - Session
      description: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': &id001
          description: Invalid request or business value
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id002
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id003
          description: Role or assignment does not permit this action
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404': &id004
          description: Resource unavailable to this principal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id005
          description: Stale version, invalid transition or conflicting idempotency
            key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/markets:
    get:
      summary: List illustrative APAC market configuration
      operationId: get__api_markets
      tags:
      - Reference
      description: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
  /api/claims:
    get:
      summary: List visible claims with pagination
      operationId: get__api_claims
      tags:
      - Claims
      description: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: &id007
          - SUBMITTED
          - UNDER_REVIEW
          - AWAITING_INFORMATION
          - APPROVED
          - SETTLED
          - REJECTED
      - name: market
        in: query
        schema:
          type: string
      - name: assignee
        in: query
        schema:
          type: string
          description: Officer username or me. Claimants remain restricted to their
            own claims.
      - name: search
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
          maximum: 10000
      - name: size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    post:
      summary: Submit a claim as the authenticated claimant
      operationId: post__api_claims
      tags:
      - Claims
      description: CLAIMANT only. The backend derives ownership and currency. Same
        principal/key/body replays the existing claim (200); changed content returns
        409. New submissions return 201.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          headers:
            Idempotent-Replay:
              schema:
                type: boolean
              description: True when an earlier submission was replayed
            Location:
              schema:
                type: string
              description: Claim API resource
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '201':
          description: New claim created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          headers:
            Idempotent-Replay:
              schema:
                type: boolean
              description: True when an earlier submission was replayed
            Location:
              schema:
                type: string
              description: Claim API resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaim'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{8,100}$
  /api/claims/{id}:
    get:
      summary: Read a visible claim with its timeline and requests
      operationId: get__api_claims_id
      tags:
      - Claims
      description: ''
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - &id006
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/claims/{id}/assign:
    post:
      summary: Pick up an unassigned submitted claim
      operationId: post__api_claims_id_assign
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      parameters:
      - *id006
  /api/claims/{id}/information-requests:
    post:
      summary: Request additional information
      operationId: post__api_claims_id_information_requests
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Command'
              - type: object
                properties:
                  note:
                    type: string
                    minLength: 5
                    maxLength: 2000
                required:
                - note
      parameters:
      - *id006
  /api/claims/{id}/assessment:
    post:
      summary: Record assessed reserve and rationale
      operationId: post__api_claims_id_assessment
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Command'
              - type: object
                properties:
                  note:
                    type: string
                    minLength: 5
                    maxLength: 2000
                required:
                - note
      parameters:
      - *id006
  /api/claims/{id}/approve:
    post:
      summary: Approve an assessed claim
      operationId: post__api_claims_id_approve
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      parameters:
      - *id006
  /api/claims/{id}/settle:
    post:
      summary: Record settlement within the assessed reserve
      operationId: post__api_claims_id_settle
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      parameters:
      - *id006
  /api/claims/{id}/reject:
    post:
      summary: Reject a claim with a reason
      operationId: post__api_claims_id_reject
      tags:
      - Workflow
      description: STAFF only. Except assignment, the officer must own the claim.
        Supply the last observed aggregate version; conflicts return 409. Settlement
        is a recorded decision, not a funds transfer.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Command'
              - type: object
                properties:
                  note:
                    type: string
                    minLength: 5
                    maxLength: 2000
                required:
                - note
      parameters:
      - *id006
  /api/claims/{id}/information-requests/{requestId}/response:
    post:
      summary: Answer an open information request
      operationId: post__api_claims_id_information_requests_requestId_response
      tags:
      - Workflow
      description: Owning CLAIMANT only. Moves AWAITING_INFORMATION back to UNDER_REVIEW.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationResponse'
      parameters:
      - *id006
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/insights:
    get:
      summary: Read eventually consistent team reporting
      operationId: get__api_insights
      tags:
      - Reporting
      description: STAFF only. Reserves exclude unassessed claims and terminal states.
        Currencies are never added together. lastUpdated is the latest projection
        application time, not a guarantee that all events have arrived.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
      parameters:
      - name: market
        in: query
        schema:
          type: string
          enum:
          - SG
          - AU
          - HK
          - JP
          - MY
          - NZ
  /api/operations:
    get:
      summary: Read the count of unpublished outbox events
      operationId: get__api_operations
      tags:
      - Operations
      description: STAFF only. Zero pending means publication has completed; consumers
        may still be catching up.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingEvents:
                    type: integer
                required: &id008 []
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CreateClaim:
      type: object
      properties:
        type:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        market:
          type: string
          enum:
          - SG
          - AU
          - HK
          - JP
          - MY
          - NZ
        incidentDate:
          type: string
          format: date
          description: Incident date must not be in the future, evaluated in UTC.
        location:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 10
          maxLength: 4000
        requestedAmount:
          type: number
          minimum: 0.01
          maximum: 999999999999.99
          description: Positive decimal; precision must match the market currency.
            JPY requires whole units.
      required:
      - type
      - market
      - incidentDate
      - location
      - description
      - requestedAmount
    Command:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        note:
          type: string
          maxLength: 2000
          nullable: true
        amount:
          type: number
          nullable: true
      required:
      - version
    InformationResponse:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
        answer:
          type: string
          minLength: 2
          maxLength: 4000
      required:
      - version
      - answer
    Claim:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        claimantId:
          type: string
        type:
          type: string
          enum:
          - MOTOR
          - PROPERTY
        market:
          type: string
        currency:
          type: string
        incidentDate:
          type: string
          format: date
        location:
          type: string
        description:
          type: string
        requestedAmount:
          type: number
        status:
          type: string
          enum: *id007
        assignee:
          type: string
          nullable: true
        reserveAmount:
          type: number
          minimum: 0
        settlementAmount:
          type: number
          minimum: 0
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - reference
      - claimantId
      - type
      - market
      - currency
      - incidentDate
      - location
      - description
      - requestedAmount
      - status
      - assignee
      - reserveAmount
      - settlementAmount
      - version
      - createdAt
      - updatedAt
      - closedAt
    History:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        note:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: *id008
    InformationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        requestedBy:
          type: string
        requestedAt:
          type: string
          format: date-time
        answer:
          type: string
          nullable: true
        answeredAt:
          type: string
          format: date-time
          nullable: true
      required: *id008
    Detail:
      type: object
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
        informationRequests:
          type: array
          items:
            $ref: '#/components/schemas/InformationRequest'
      required:
      - claim
      - history
      - informationRequests
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer
      required:
      - items
      - total
      - page
      - size
    Session:
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum:
          - CLAIMANT
          - STAFF
      required:
      - username
      - role
    Market:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        currency:
          type: string
      required:
      - code
      - name
      - currency
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        traceId:
          type: string
      required: *id008
    Dashboard:
      type: object
      properties:
        totalClaims:
          type: integer
        openClaims:
          type: integer
        closedClaims:
          type: integer
        averageClosureHours:
          type: number
        byStatus:
          type: object
          additionalProperties:
            type: integer
        officers:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              assigned:
                type: integer
              open:
                type: integer
              waiting:
                type: integer
              closed:
                type: integer
            required: *id008
        exposure:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
              outstandingReserve:
                type: number
              settledAmount:
                type: number
              unassessedClaims:
                type: integer
            required: *id008
        lastUpdated:
          type: string
          format: date-time
          nullable: true
      required: *id008
